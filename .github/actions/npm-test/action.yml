name: npm-test
description: >-
  Reusable test gate: checkout, install nvm + the exact Node from .nvmrc
  (npm cache), npm ci, run the full test suite (smoke + MCP e2e + persist +
  chat e2e + git-remote e2e + web e2e). Shared by ci.yml and release.yml —
  update in one place.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    # .nvmrc stays the single source for the version; setup-node is the
    # battle-tested path (install-nvm's curl|bash bootstrap became a
    # fast-fail source on hosted runners)
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: npm ci (retry — registry/GitHub flakes)
      run: |
        for i in 1 2 3 4 5; do
          npm ci --no-audit --no-fund && exit 0
          echo "::warning::npm ci attempt $i failed — retrying in $((i*10))s"
          sleep $((i*10))
        done
        exit 1
      shell: bash
    - name: npm test
      run: npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
      shell: bash
    - name: failure diagnostics (public)
      if: failure()
      run: |
        LOG="$RUNNER_TEMP/npm-test.log"
        { echo '### npm test failed — output tail'; echo ''; echo '\`\`\`'; tail -n 80 "$LOG" 2>/dev/null; echo '\`\`\`'; } >> "$GITHUB_STEP_SUMMARY"
        tail -n 5 "$LOG" 2>/dev/null | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
      shell: bash
