name: npm-test
description: >-
  Reusable test gate: checkout, set up Node 22 (npm cache), npm ci, run the
  full test suite (smoke + MCP e2e + persist + chat e2e + git-remote e2e +
  web e2e). Shared by ci.yml and release.yml — update in one place.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - run: npm test
      shell: bash
