name: ci

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']        # tags gate on release.yml instead
  pull_request:

# bash everywhere: on windows runners GitHub maps this to Git Bash,
# which is what the run blocks are written for
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4   # required before ./ local actions — runner reads action.yml from the workspace
      - uses: ./.github/actions/npm-test
