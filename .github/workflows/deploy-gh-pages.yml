# Example consumer workflow for the ipfs-gh-pages reusable action.
#
# By default this tracks the action repo's current state: the newest v* tag
# (currently v3.0.0) is auto-detected at run time, falling back to the
# default-branch HEAD when no tag exists. Pin a specific ref instead via
# workflow_dispatch (action_ref) or by setting REF explicitly below.

name: Deploy IPFS site

on:
  push:
    # DEFAULT BRANCH ONLY (maintainer decision): tags are not allowed to
    # deploy to github-pages ("branch/tag rules"). Keep the pages
    # concurrency group's cancel-in-progress: false so pushes don't
    # cancel in-flight deploys.
    branches: [master]
  workflow_dispatch:
    inputs:
      action_ref:
        description: 'Action ref (SHA, branch, or tag e.g. v3.0.0). Empty = auto-detect newest v* tag, else default-branch HEAD.'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Node.js version to use for the build'
        required: true
        default: '20'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NEVER cancel an in-flight Pages deploy: with rapid master pushes
  # (patch-bump cadence) cancel-in-progress:true killed every deploy
  # mid-flight and left a red X on each run (observed: 3 consecutive
  # master pushes, 3 failed deploys ~40s in). Queue instead — the last
  # queued run deploys newest-HEAD anyway.
  cancel-in-progress: false

# bash everywhere: on windows runners GitHub maps this to Git Bash,
# which is what the run blocks are written for
defaults:
  run:
    shell: bash

jobs:
  changed:
    # Gate kept (must always run — a skipped `needs` job would skip
    # build-and-deploy no matter what its own `if` says) but trivial now
    # that the schedule trigger is gone: a tag push or dispatch IS a
    # deploy-worthy event.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - name: Decide
        id: gate
        run: echo "changed=true" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: changed
    # Plain if — safe because `changed` always runs (see its comment).
    if: needs.changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          # The deployed site and IPFS mirror cover the whole repo:
          # submodule contents flatten into repo-manifest.json / repo.car
          # (an uninitialized submodule contributes zero entries instead
          # of failing the build).
          submodules: recursive

      - name: Fetch latest tag (release identity)
        run: |
          # The build bakes the repo's latest v* tag into the page (the
          # header "latest release" chip). The default checkout is shallow
          # and has no tags — fetch just the newest tag, no full history.
          TAG=$(git ls-remote --refs --tags --sort=-v:refname origin 'v*' | head -n 1 | cut -f2 | sed 's|^refs/tags/||' || true)
          if [ -n "$TAG" ]; then
            git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
            echo "Fetched latest tag for the build identity: $TAG"
          else
            echo "No v* tags on origin — the build falls back to the static version"
          fi

      - name: Determine Action Ref and Node Version
        id: set-inputs
        run: |
          # Pin explicitly via workflow_dispatch; otherwise auto-detect the
          # action repo's current state: newest v* tag, else HEAD.
          REF="${{ github.event.inputs.action_ref }}"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --refs --tags --sort=-v:refname https://github.com/RandyMcMillan/ipfs-gh-pages.git 'v*' | head -n 1 | cut -f2 | sed 's|^refs/tags/||' || true)
            if [ -n "$REF" ]; then
              echo "Auto-detected newest tag of RandyMcMillan/ipfs-gh-pages: $REF"
            else
              REF=$(git ls-remote https://github.com/RandyMcMillan/ipfs-gh-pages.git HEAD | cut -f1 || true)
              echo "No v* tags found — using default-branch HEAD: $REF"
            fi
          fi
          echo "action_ref=$REF" >> $GITHUB_OUTPUT
          echo "Using action ref: $REF"

          NODE_VER="${{ github.event.inputs.node_version }}"
          if [ -z "$NODE_VER" ]; then
            NODE_VER="20"
          fi
          echo "node_version=$NODE_VER" >> $GITHUB_OUTPUT
          echo "Using Node version: $NODE_VER"

      - name: Checkout Action Repository and Pull Tags
        uses: actions/checkout@v4
        with:
          repository: RandyMcMillan/ipfs-gh-pages
          ref: ${{ steps.set-inputs.outputs.action_ref }}
          path: temp-action-repo
          fetch-tags: true # Ensures tags are fetched during checkout

      - name: Print Diff (Selected Ref vs Main Branch)
        run: |
          echo "=========================================="
          echo "Comparing selected ref (${{ steps.set-inputs.outputs.action_ref }}) vs main"
          echo "=========================================="
          cd temp-action-repo
          git fetch --tags origin
          git fetch origin main || git fetch origin master || true
          git diff ${{ steps.set-inputs.outputs.action_ref }} origin/main || git diff ${{ steps.set-inputs.outputs.action_ref }} origin/master || true

      - name: Build and deploy IPFS site
        id: deploy
        uses: ./temp-action-repo
        with:
          node-version: ${{ steps.set-inputs.outputs.node_version }}
          deploy: 'true'
          # Optional: pin the release CAR to Pinata public IPFS. Create the
          # secret in the repo's Settings → Secrets and variables → Actions
          # (a Pinata JWT from app.pinata.cloud → Keys). Missing/empty = skipped.
          pinata-jwt: ${{ secrets.PINATA_JWT }}
          # Optional: pin the release CAR to Filebase IPFS. Create three
          # secrets in the repo's Settings → Secrets and variables → Actions
          # (Filebase dashboard → Access Keys: accessKeyId + secretAccessKey;
          # the bucket is the bucket you pin into). Missing/empty = skipped.
          filebase-access-key-id: ${{ secrets.FILEBASE_ACCESS_KEY_ID }}
          filebase-secret-access-key: ${{ secrets.FILEBASE_SECRET_ACCESS_KEY }}
          filebase-bucket: ${{ secrets.FILEBASE_BUCKET }}


