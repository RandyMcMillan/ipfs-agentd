name: release

# Fired by pushing a signed version tag (v*). Runs the full test suite first,
# then publishes a GitHub release and pushes the all-in-one image to GHCR.
# Nothing here depends on GitHub for the software's function — releases and
# the registry are just distribution conveniences; the artifact remains a
# self-contained daemon + web service + git remote helpers.
# ci.yml ignores v* tags; this workflow owns the tag test gate and the
# GitHub release. Image publishing lives in docker.yml (single owner).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (default: the ref that dispatched)'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/npm-test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resolve-tag
        id: meta
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_tag: true
