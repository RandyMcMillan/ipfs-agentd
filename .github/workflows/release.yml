name: release

# Fired by pushing a signed version tag (v*). Pipeline:
#   1. test gate (full suite, same composite as ci.yml)
#   2. meta: resolve the tag and verify it matches package.json's version
#      (guards against tagging the wrong SHA / version drift)
#   3. binaries: single-executable apps (Node SEA + esbuild CJS bundle) built
#      natively on linux-x64, windows-x64 and macos-arm64, smoke-tested with
#      --help, attached to the GitHub release along with a git bundle of the
#      released commit (the gnostr-native distribution unit)
#   4. npm publish with provenance — only when the NPM_TOKEN secret is set
# Nothing here depends on GitHub for the software's function — releases and
# the registry are just distribution conveniences; the artifact remains a
# self-contained daemon + web service + git remote helpers.
# Image publishing (incl. version tags) lives in docker.yml (single owner);
# ci.yml ignores v* tags; this workflow owns the tag test gate.
# The GPG-signed tag itself stays the maintainer's manual act — pushing it
# is what fires this workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (default: the ref that dispatched)'
        required: false

# bash everywhere: on windows runners GitHub maps this to Git Bash,
# which is what the run blocks are written for
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # required before ./ local actions — runner reads action.yml from the workspace
      - uses: ./.github/actions/npm-test

  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resolve-tag
        id: resolve
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: version
        run: |
          set -euo pipefail
          TAG='${{ steps.resolve.outputs.tag }}'
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # the pushed tag must be exactly v<package.json version> — anything
          # else means the SHA or the version files were not prepared
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION — fix the version files or re-tag"
            exit 1
          fi
          echo "tag $TAG matches package.json — releasing"

  # Single-executable apps via Node SEA (Single Executable Applications):
  # esbuild bundles the ESM tree to one CJS file (SEA only runs a single
  # embedded CJS script), node --experimental-sea-config produces the blob,
  # postject injects it into a copy of the runner's own node binary. No
  # native modules in the dep tree (see package.json) — pure JS bundles
  # cleanly. Built natively per OS; macos-latest is arm64, so the asset is
  # named honestly (darwin-arm64).
  binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    outputs:
      any: ${{ steps.build.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (retry — registry/GitHub flakes)
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci attempt $i failed — retrying in $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Build single-executable binary
        id: build
        run: |
          set -euo pipefail
          TAG='${{ needs.meta.outputs.tag }}'
          npx esbuild src/bin.js --bundle --platform=node --format=cjs \
            --target=node22 --outfile=dist/sea-main.cjs
          printf '{ "main": "dist/sea-main.cjs", "output": "sea-prep.blob" }\n' > sea-config.json
          node --experimental-sea-config sea-config.json
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          cp "$(command -v node)" "dist/ipfs-agentd$EXT"
          npx postject "dist/ipfs-agentd$EXT" NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          # postject invalidates the copied binary's signature — macOS kills
          # the binary on launch ("killed: 9") unless it is ad-hoc re-signed
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --sign - --force "dist/ipfs-agentd$EXT"; fi
          OS=$(node -p process.platform); ARCH=$(node -p process.arch)
          ASSET="ipfs-agentd-${TAG}-${OS}-${ARCH}${EXT}"
          mv "dist/ipfs-agentd$EXT" "dist/$ASSET"
          chmod +x "dist/$ASSET" 2>/dev/null || true
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the binary
        run: |
          set -euo pipefail
          ASSET='${{ steps.build.outputs.asset }}'
          # capture to a file, NOT a pipe: `| head -5` races the writer and
          # pipefail turns the writer's SIGPIPE into a leg failure (hit on
          # macOS arm64); a real crash must print its own evidence
          "./dist/$ASSET" --help > "$RUNNER_TEMP/smoke.out" 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::binary exited $rc — output follows:"
            cat "$RUNNER_TEMP/smoke.out"
            echo "::error::binary diagnostics:"
            file "./dist/$ASSET" || true
            ls -la "./dist/$ASSET" || true
            if [ "$RUNNER_OS" = "macOS" ]; then
              codesign -dv --verbose=4 "./dist/$ASSET" 2>&1 | head -20 || true
              xattr -l "./dist/$ASSET" || true
            fi
            exit 1
          fi
          head -5 "$RUNNER_TEMP/smoke.out"
          echo "binary smoke OK: $ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.os }}-${{ runner.arch }}
          path: dist/ipfs-agentd-*
          if-no-files-found: error

  release:
    needs: [test, meta, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/resolve-tag
        id: meta

      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Git bundle of the released commit (gnostr distribution unit)
        run: |
          set -euo pipefail
          git bundle create "dist/ipfs-agentd-${{ steps.meta.outputs.tag }}.bundle" HEAD
          ls -lh dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ipfs-agentd-*
            dist/*.bundle

  # Optional: publishes to npm with provenance. No-op unless the NPM_TOKEN
  # repository secret is configured (Settings → Secrets → Actions). The
  # package ships its bin wrappers (src/bin.js, git-remote-* helpers).
  npm:
    needs: [test, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      # secrets are not available in job-level `if:` — gate at step level instead
      - name: Skip when NPM_TOKEN is not configured
        if: env.NPM_TOKEN == ''
        run: echo 'NPM_TOKEN secret not set — skipping npm publish'
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - if: env.NPM_TOKEN != ''
        run: npm ci --no-audit --no-fund
      - name: Publish to npm (provenance)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
