name: interop

# Live interop — workflow_dispatch with per-OS select (default linux) OR on
# every push to master (input defaults apply):
# each selected runner hosts two independent ipfs-agentd nodes plus the real
# git-remote-gnostr CLI helper; the linux leg additionally builds the Docker
# image and joins the container itself as an independent peer.
#   1. publisher daemon seeds a git bundle for INTEROP_LIVE_SECS and re-announces
#      it on the real "gnostr" topic every 15s (externally observable)
#   2. a second, independent node fetches the bundle by CID (bitswap, direct dial)
#      and by name (topic discovery)
#   3. the real git-remote-gnostr helper clones gnostr://cid/<CID> with plain git
#   4. linux only: a Docker container runs the fetcher and the helper clone
# The job then waits out the live window so external peers can confirm the ad.

on:
  # input defaults apply on push (github.event.inputs is empty): linux only,
  # live free-catalog opencode query, copilot ON (until the witness leg is
  # green — more beam data per run), verbose off, bump_on_pass on. beam-promote pushes with GITHUB_TOKEN, which does NOT re-trigger
  # workflows — no push/promote loop.
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to check out and interop-test (e.g. master, v0.3.2)'
        default: 'master'
      live_seconds:
        description: 'How long the publisher keeps seeding (seconds)'
        default: '600'
      linux:
        description: 'Run on ubuntu-latest (includes Docker peer leg)'
        type: boolean
        default: true
      windows:
        description: 'Run on windows-latest'
        type: boolean
        default: false
      macos:
        description: 'Run on macos-latest'
        type: boolean
        default: false
      # --- model beam (copilot-chat + opencode-chat legs) -----------------------
      # copilot is PAID -> was DEFAULT OFF; TEMPORARILY DEFAULT ON until the
      # witness leg passes (more beam data per run; dispatch can turn it off). The opencode leg
      # is free-first; precedence: opencode_models (list) > opencode_model
      # (single) > live free-catalog query (`opencode models | grep -i free`,
      # first 3 — the free list rotates weekly, never hardcode it). The
      # dispatch dropdown itself CANNOT be populated from a query; the
      # catalog job below does it in-workflow and feeds a dynamic matrix.
      #
      # CURRENTLY CONFIGURED: OpenCode auth is the OPENCODE repo secret —
      # an opencode.ai/console token written to OPENCODE_API_KEY in every
      # opencode job. (The earlier OIDC token-exchange sign-in and its
      # client_id were removed after GitHub secret scanning flagged the
      # client_id — security/secret-scanning/1; no repo variable needed.
      # Rotate by updating the OPENCODE secret.) The default free query
      # selects opencode/ models (the Zen provider's `*-free` ids;
      # opencode-go/ models need a separate GO subscription — excluded).
      # Probe the key:
      #   curl https://opencode.ai/zen/v1/models -H "Authorization: Bearer $KEY"
      #
      # Free alternatives if you swap the secret (Settings -> Secrets and
      # variables -> Actions):
      #   * OpenRouter free models — https://openrouter.ai/keys, free key, no
      #     card; IDs ending :free are $0 (50 req/day, 1,000/day after a
      #     one-time $10 top-up). Exposed as OPENROUTER_API_KEY; also switch
      #     the catalog grep in opencode-catalog from '^opencode/' to
      #     '^openrouter/'.
      #   * Google Gemini free tier — https://aistudio.google.com, free key,
      #     ~1,500 requests/day; exposed as GEMINI_API_KEY / GOOGLE_API_KEY.
      #   * OpenAI — https://platform.openai.com/api-keys (PAID, no free
      #     tier; expose as OPENAI_API_KEY + OPENAI_BASE_URL=
      #     https://api.openai.com/v1 and switch the grep to '^openai/').
      # The steps expose the SAME secret as OPENCODE_API_KEY, OPENAI_API_KEY,
      # OPENROUTER_API_KEY and GEMINI_API_KEY so any of the above just works;
      # if your provider wants another name (GROQ_API_KEY, ...), add it there.
      copilot:
        description: 'Model beam: Copilot leg (PAID -- needs a Copilot seat; free tier ~50 premium req/month)'
        type: boolean
        default: true
      a2aipfs:
        description: 'a2aipfs protocol conformance leg (signed envelopes + witness attestation over the cold mesh)'
        type: boolean
        default: true
      opencode_model:
        description: 'OpenCode leg: ONE model (provider/model, e.g. opencode/gpt-4.1-mini); empty = live free-catalog matrix'
        default: ''
      opencode_models:
        description: 'OpenCode leg: MULTI-model matrix (comma-separated provider/model list; overrides opencode_model)'
        default: ''
      verbose:
        description: 'Model beam: verbose agent chat — opencode streams --thinking + --print-logs; full transcripts land in the step summary; the full gnostr chat negotiation (question/answer envelopes) is echoed to the CI log + step summary'
        type: boolean
        default: false
      bump_on_pass:
        description: 'Model beam: if any leg gets a WITNESS PASS, bump the patch version on master (unsigned bot commit — tags stay manual/signed)'
        type: boolean
        default: true

# one interop run at a time per ref: stacked pushes queue the model legs
# behind the previous run's legs, the delayed questions land in a shrunken
# responder window, and legs fail for queueing, not protocol (observed:
# run 45419388460's opencode legs started ~6 min late behind run 45417111891)
concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

env:
  INTEROP_LIVE_SECS: ${{ github.event.inputs.live_seconds || '600' }}

# bash everywhere: on windows runners GitHub maps this to Git Bash, which is
# what every run block below is written for
defaults:
  run:
    shell: bash

jobs:
  # build the runner matrix from the per-OS selects; empty → whole workflow skips
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        run: |
          # build the matrix JSON without external tools (jq availability is not
          # guaranteed on all runner images); booleans arrive from the dispatch
          # inputs as the literal strings true/false
          include=''; sep=''
          add() { include="${include}${sep}{\"os\":\"$1\",\"docker\":$2}"; sep=','; }
          [ "${{ github.event.inputs.linux != 'false' }}"   = "true" ] && add ubuntu-latest true  || echo 'linux not selected'
          [ "${{ github.event.inputs.windows == 'true' }}"  = "true" ] && add windows-latest false || echo 'windows not selected'
          [ "${{ github.event.inputs.macos == 'true' }}"    = "true" ] && add macos-latest false || echo 'macos not selected'
          include="[$include]"
          echo "include=$include" >> "$GITHUB_OUTPUT"   # single-line JSON
          echo "matrix: $include"

  live-interop:
    needs: [matrix, opencode-catalog]
    if: needs.matrix.outputs.include != '[]'
    permissions:
      contents: read
      actions: read   # gh run download — fetch the copilot-chat bridge artifact
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # the publisher bundles $GITHUB_WORKSPACE — depth-1
                           # checkouts produce bundles missing HEAD's parents

      # .nvmrc stays the single source for the version; setup-node covers all
      # three OSes (the nvm bootstrap proved flaky on macOS runners)
      - name: Node (.nvmrc via setup-node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # ONE step for the non-docker legs. Windows runners kill the step's
      # process tree when the step ends, so the publisher, the cross-daemon
      # fetch, the helper clone AND the live window must share a single step
      # there; unix runners persist background processes across steps, so the
      # docker legs and the live window run as their own steps below.
      - name: Live interop — publisher + cross-daemon fetch + helper clone
        timeout-minutes: 28
        run: |
          set -u
          # git-bash (MSYS2) rewrites env VALUES that look like POSIX paths
          # when spawning native processes: GNOSTR_LISTEN lost its leading
          # slash (publisher died with InvalidMultiaddrError). ARG_CONV_EXCL
          # only covers arguments, so multiaddrs travel via staged FILES —
          # native paths for the pointers, contents read after the MSYS
          # boundary in src/node.js (GNOSTR_*_FILE).
          export MSYS2_ARG_CONV_EXCL='*'
          export MSYS2_ENV_CONV_EXCL='*'
          INTEROP_OUT="$RUNNER_TEMP/interop"   # valid on linux, macOS AND windows
          mkdir -p "$INTEROP_OUT"
          echo "INTEROP_OUT=$INTEROP_OUT" >> "$GITHUB_ENV"

          # chat responder FIRST — before the publisher. The model legs' chat
          # witnesses start on their own runners within minutes of run start
          # and time out after 8 min; a responder that only starts after the
          # publisher's CID handshake misses their window (observed live: a
          # leg's agent found the responder not yet up and its witness died
          # on timeout). The responder needs no local state: it joins the
          # public topic and the bridge writer below feeds it every leg's
          # relay addrs. Windows kills the step's process tree at step end,
          # so the responder must stay inside this all-in-one step — the
          # earliest possible point is right here. Every matrix instance
          # runs one, answering chat envelopes whose text contains a
          # run-scoped question marker (one per model leg — copilot and each
          # opencode model; the responder matches the BASE marker, so every
          # suffix matches). The responder's answer carries its real
          # platform/hostname/peer id — knowledge the asker cannot fabricate.
          # Bridge: EVERY model leg's witness uploads its relay addrs as a
          # chat-bridge-<run_id>[-suffix] artifact; this background writer
          # polls the run's artifact list (the set of legs is dynamic — a
          # free-catalog matrix) and keeps refreshing the responder's
          # bootstrap file, which the responder re-reads every 30s. The
          # public gnostr mesh alone does not reliably deliver between
          # arbitrary runners.
          BRIDGE="$INTEROP_OUT/bridge"
          # committed script (scripts/observe/ci-bridge-writer.sh) — curl, not
          # gh: gh needs GH_TOKEN in env and fails SILENTLY inside
          # 2>/dev/null | grep || true chains (observed: an entire run whose
          # writer wrote nothing for 15 min — the responder saw zero witness
          # addrs and every model leg timed out unanswered). Output goes to a
          # file: background stdout dies with the step; the Live window step
          # cats it.
          GH_TOKEN="${{ github.token }}" bash scripts/observe/ci-bridge-writer.sh \
            "${{ github.repository }}" "${{ github.run_id }}" \
            "$INTEROP_OUT/responder-bootstrap" "$BRIDGE" 45 \
            > "$INTEROP_OUT/bridge-writer.log" 2>&1 &
          echo "bridge writer pid $! (refreshes responder-bootstrap for ~15 min)"
          printf '/ip4/127.0.0.1/tcp/4013' > "$INTEROP_OUT/responder-listen"
          : > "$INTEROP_OUT/responder-bootstrap"   # empty until the bridge/publisher addrs land
          INTEROP_TOPIC=gnostr \
          INTEROP_QUESTION_MARKER=gnostr-interop-question-${{ github.run_id }} \
          GNOSTR_LISTEN_FILE="$INTEROP_OUT/responder-listen" GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4013 \
          GNOSTR_BOOTSTRAP_FILE="$INTEROP_OUT/responder-bootstrap" \
          INTEROP_LIVE_SECS=$(( ${{ env.INTEROP_LIVE_SECS }} + 600 )) \
          node scripts/chat-responder.mjs 2>"$INTEROP_OUT/responder.log" &
          echo "responder pid $! (log: $INTEROP_OUT/responder.log)"

          printf '/ip4/127.0.0.1/tcp/4011' > "$INTEROP_OUT/listen"
          GNOSTR_LISTEN_FILE="$INTEROP_OUT/listen" \
          INTEROP_REPO=$GITHUB_WORKSPACE \
          INTEROP_NAME=ipfs-agentd-ci-${{ github.run_id }}-${{ matrix.os }} \
          INTEROP_OUT=$INTEROP_OUT \
          node test/interop-publisher.mjs 2>"$INTEROP_OUT/publisher.log" &
          echo $! > "$INTEROP_OUT/pub.pid"
          echo "publisher pid $(cat "$INTEROP_OUT/pub.pid"), live window ${{ env.INTEROP_LIVE_SECS }}s"

          for i in $(seq 1 90); do [ -f "$INTEROP_OUT/cid" ] && break; sleep 2; done
          if [ ! -f "$INTEROP_OUT/cid" ]; then echo 'publisher did not become ready'; tail -50 "$INTEROP_OUT/publisher.log"; exit 1; fi
          CID=$(cat "$INTEROP_OUT/cid"); PEER=$(cat "$INTEROP_OUT/peer"); NAME=$(cat "$INTEROP_OUT/name")
          echo "CID=$CID" >> "$GITHUB_ENV"; echo "PEER=$PEER" >> "$GITHUB_ENV"; echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "publisher ready: name=$NAME cid=$CID peer=$PEER"

          echo '::group::cross-daemon fetch (bitswap by CID + topic discovery by name)'
          printf '/ip4/127.0.0.1/tcp/4011/p2p/%s' "$PEER" > "$INTEROP_OUT/bootstrap"
          GNOSTR_BOOTSTRAP_FILE="$INTEROP_OUT/bootstrap" INTEROP_PEER=$PEER INTEROP_OUT=$INTEROP_OUT node test/interop-fetch.mjs
          echo '::endgroup::'

          echo '::group::git-remote-gnostr interop (real CLI helper clone)'
          # the helper is ESM — copying it off its repo breaks module resolution,
          # so shim it: a PATH-visible wrapper execs the real script in /tmp/relay.
          # fatal: this clone-through-gnostr leg is part of the critical path.
          CLONE_DIR=$(mktemp -d)
          git clone -q https://github.com/RandyMcMillan/helia-ipfs-relay /tmp/relay && \
          (cd /tmp/relay && npm install --no-audit --no-fund) && \
          git config --global protocol.gnostr.allow always && \
          mkdir -p "$HOME/.local/bin" && \
          printf '#!/bin/sh\nexec node /tmp/relay/git-remote-gnostr.js "$@"\n' > "$HOME/.local/bin/git-remote-gnostr" && \
          chmod +x "$HOME/.local/bin/git-remote-gnostr" && \
          GNOSTR_BOOTSTRAP="/ip4/127.0.0.1/tcp/4011/p2p/$PEER" PATH="$HOME/.local/bin:$PATH" \
            timeout 300 git clone "gnostr://cid/$CID" "$CLONE_DIR" && \
          test -f "$CLONE_DIR/package.json" && \
          test -f "$CLONE_DIR/src/mcp-server.js" && \
          git -C "$CLONE_DIR" log --oneline -5
          echo '::endgroup::'

          if [ "$RUNNER_OS" = "Windows" ]; then :; fi

          # responder diagnostics: the legs' witness logs name what they saw;
          # without this tail the responder side is a black box (a leg once
          # failed with "never saw an answer" and there was no way to tell
          # whether the responder heard the question at all)
          echo '::group::responder.log (tail)'
          tail -n 80 "$INTEROP_OUT/responder.log" 2>/dev/null || echo '(no responder.log)'
          echo '::endgroup::'

      - name: Docker peer — build image
        if: matrix.docker
        timeout-minutes: 15
        # buildx + the shared gha cache (written by docker.yml on the same
        # branch): the plain docker build ignored all caching and rebuilt
        # npm ci from scratch on every leg
        run: |
          docker buildx build --load -t ipfs-agentd:interop \
            --cache-from type=gha --cache-to type=gha,mode=max .

      - name: Docker peer — container fetcher (independent node in-container)
        if: matrix.docker
        timeout-minutes: 8
        # run from the image's OWN baked /app (src + musl-compatible
        # node_modules) — bind-mounting the runner's glibc-built
        # node_modules over it breaks native modules on alpine.
        run: |
          set -o pipefail
          # recreate the state dir: $RUNNER_TEMP/interop does not reliably
          # survive between steps on hosted runners (chmod failed with ENOENT
          # even though GITHUB_ENV carried the path). CID/NAME go via env —
          # only the fetcher's store needs the mounted dir.
          mkdir -p "$INTEROP_OUT"
          # hosted-runner uid (1001) != image node uid (1000), and anything
          # the host wrote must be writable at EVERY level for the container
          chmod -R 777 "$INTEROP_OUT" 2>/dev/null || true
          docker run --rm --network host \
            -v "$INTEROP_OUT:/tmp/interop" \
            -e GNOSTR_BOOTSTRAP=/ip4/127.0.0.1/tcp/4011/p2p/$PEER \
            -e INTEROP_CID=$CID \
            -e INTEROP_NAME=$NAME \
            -e INTEROP_PEER=$PEER \
            -e INTEROP_OUT=/tmp/interop \
            ipfs-agentd:interop node test/interop-fetch.mjs 2>&1 | tee "$INTEROP_OUT/docker-fetcher.log"

      - name: Docker peer — container clone via in-repo git-remote-gnostr
        if: matrix.docker
        timeout-minutes: 8
        run: |
          set -o pipefail
          docker run --rm --network host \
            ipfs-agentd:interop sh -c '
              mkdir -p /tmp/bin
              printf "#!/bin/sh\nexec node /app/src/git-remote-gnostr.js \"\$@\"\n" > /tmp/bin/git-remote-gnostr
              chmod +x /tmp/bin/git-remote-gnostr
              export PATH=/tmp/bin:$PATH
              git config --global protocol.gnostr.allow always
              rm -rf /tmp/clone
              GNOSTR_BOOTSTRAP="/ip4/127.0.0.1/tcp/4011/p2p/'"$PEER"'" git clone "gnostr://cid/'"$CID"'" /tmp/clone
              git -C /tmp/clone log --oneline -2
              git -C /tmp/clone fsck --strict
            ' 2>&1 | tee "$INTEROP_OUT/docker-clone.log"

      - name: Live window — publisher keeps seeding (external confirmation open)
        if: runner.os != 'Windows'   # windows already waited out the window in the merged step
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LEGS: ${{ needs.opencode-catalog.outputs.models }}
        run: |
          echo "::notice::LIVE name=$NAME bundle=$CID peer=$PEER — ad on gnostr topic, seeding for ${{ env.INTEROP_LIVE_SECS }}s total"
          echo "tail of publisher log:"
          tail -5 "$INTEROP_OUT/publisher.log"
          # early exit: the window exists for the model legs — once every
          # catalog leg has uploaded beam-pass-<run_id>-*, nobody needs the
          # seed anymore (a full-pass run ends in ~5 min, not 10+). Failed
          # legs upload nothing, so a partial house still waits the window
          # out — the responder stays reachable for stragglers.
          EXPECTED=$(printf '%s' "$EXPECTED_LEGS" | python3 -c 'import json,sys
          try: print(len(json.load(sys.stdin)))
          except Exception: print(0)')
          echo "expecting $EXPECTED model-leg pass artifact(s)"
          while kill -0 "$(cat "$INTEROP_OUT/pub.pid")" 2>/dev/null; do
            if [ "$EXPECTED" -gt 0 ]; then
              PASSES=$(curl -s --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
                | python3 -c 'import json,sys
          try:
              print(sum(1 for a in json.load(sys.stdin).get("artifacts",[]) if a["name"].startswith("beam-pass-${{ github.run_id }}")))
          except Exception: print(0)')
              if [ "$PASSES" -ge "$EXPECTED" ]; then
                echo "::notice::all $EXPECTED model legs PASS — closing the live window early"
                kill "$(cat "$INTEROP_OUT/pub.pid")" 2>/dev/null || true
                break
              fi
            fi
            sleep 15
          done
          echo "publisher exited — full log:"
          cat "$INTEROP_OUT/publisher.log"
          echo '::group::bridge writer log (witness addr feed)'
          cat "$INTEROP_OUT/bridge-writer.log" 2>/dev/null || echo '(no bridge-writer.log)'
          echo '::endgroup::'
          echo '::group::responder log (full — question/answer proof)'
          cat "$INTEROP_OUT/responder.log" 2>/dev/null || echo '(no responder.log)'
          echo '::endgroup::'

  # Interop against the DEPLOYED gh-pages site (https://randymcmillan.github.io/
  # ipfs-agentd/). The site is built by deploy-gh-pages.yml from master HEAD;
  # the page itself is a browser Helia peer CI can't drive, so this leg probes
  # everything around it with scripts/check-deployed-site.mjs:
  #   1. page responds over HTTPS and looks like the ipfs-agentd app (hard)
  #   2. repo-manifest.json parses: root CID + per-file CIDs well-formed (hard)
  #   3. swarm probe: independent agent node stats/cats the advertised CIDs
  #      over bitswap (soft — the deploy's Pinata/Filebase pinning secrets are
  #      optional, so unprovidable content warns instead of failing)
  # Runs on every dispatch, independent of the OS matrix.
  deployed-site:
    name: Deployed site interop (gh-pages)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1   # this leg never bundles the checkout

      - name: Node (.nvmrc via setup-node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (retry — registry/GitHub flakes)
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci attempt $i failed — retrying in $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Probe deployed site (HTTPS + manifest + swarm)
        run: node scripts/check-deployed-site.mjs
        env:
          SITE_URL: https://randymcmillan.github.io/ipfs-agentd
          DEPLOYED_REF: ${{ inputs.ref }}

      # the Peer tab (#/peer) runs a full Helia node IN the page: libp2p boot,
      # relay reservations, mainline swarm dials over wss/webtransport/webrtc.
      # Headless chromium loads the deployed page and we assert the embedded
      # peer actually comes up — the strongest proof the deployed app works
      # as an IPFS peer without touching a browser by hand.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Peer tab — in-browser Helia node joins the swarm (playwright)
        timeout-minutes: 8
        run: |
          npx playwright install chromium
          node scripts/check-deployed-peer.mjs
        env:
          SITE_URL: https://randymcmillan.github.io/ipfs-agentd

  # Proof of concept: can an AI agent with NO prior knowledge of this repo
  # figure out its gossipsub chat, ASK a question on the live "gnostr" topic
  # and receive a REAL answer from another instance? Every live-interop matrix
  # leg runs scripts/chat-responder.mjs, which answers chat envelopes whose
  # text contains this run's marker with facts only that live node knows
  # (platform, arch, hostname, peer id). GitHub Copilot CLI gets only a hint
  # (read the repo, meet the requirements); our witness node
  # (scripts/listen-chat.mjs) must then receive BOTH the copilot's question
  # AND a responder-* answer — from a DIFFERENT libp2p peer. Bridge: the
  # witness uploads its relay multiaddrs as a run artifact (chat-bridge-<id>)
  # and each matrix leg's responder dials them directly — the public gnostr
  # mesh alone does not reliably deliver between arbitrary runners. The
  # witness ALSO runs a rendezvous server (GNOSTR_RENDEZVOUS_SERVER=1) and
  # the responders register with it on connect, so the witness discovers
  # and dials them directly — plus a direct-push stream protocol on those
  # circuit connections — no pubsub mesh luck in either direction. Select
  # ≥2 OSes for a true cross-OS answer (the responder's platform is in its
  # answer text, surfaced in the job summary). FATAL: a failure here fails
  # the job and the run.
  # Local listening during a dispatch:
  #   CHAT_TOPIC=gnostr node scripts/listen-chat.mjs
  # Copilot auth: GITHUB_TOKEN + copilot-requests: write (org policy must
  # allow Copilot CLI billed to the org); --max-ai-credits bounds the cost.
  copilot-chat:
    # PAID leg -- TEMPORARILY default on (push always runs it; dispatch
    # `copilot: false` opts out). Needs a
    # Copilot seat on the repo owner; the free tier is ~50 premium requests/
    # month. GITHUB_TOKEN gets copilot-requests: write so the CLI can bill
    # against this repo; --max-ai-credits 50 caps spend per run.
    # default ON (until the witness leg is green — more beam data per run);
    # dispatch can still turn it off. `inputs.*` is empty on push, so gate
    # on event name too.
    if: ${{ github.event_name == 'push' || inputs.copilot == true }}
    name: Copilot chat interop (hint-driven PoC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Node (.nvmrc via setup-node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (retry — registry/GitHub flakes)
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci attempt $i failed — retrying in $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Install Copilot CLI
        run: npm install -g @github/copilot && copilot --version

      # cheap gate: CLI must at least run before we start the witness. (A real
      # auth probe would burn premium requests, so copilot auth errors still
      # surface in the agent step — fast, since the CLI exits 1 on auth fail.)
      - name: Preflight — Copilot CLI present
        id: preflight
        run: |
          set -u
          set +e
          if copilot --version; then
            echo "callable=true" >> "$GITHUB_OUTPUT"
            echo "preflight PASS: copilot CLI runs"
          else
            echo "callable=false" >> "$GITHUB_OUTPUT"
            echo "reason=copilot CLI failed to run (install/GitHub flake)" >> "$GITHUB_OUTPUT"
            echo "::warning::preflight: copilot CLI not runnable"
          fi
          exit 0

      - name: Record leg as unavailable (preflight failed)
        if: steps.preflight.outputs.callable != 'true'
        continue-on-error: false   # fatal — the run goes red on failure
        run: |
          echo "### Copilot chat interop — UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preflight: ${{ steps.preflight.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Start chat witness (detached) and record bridge addrs
        if: steps.preflight.outputs.callable == 'true'
        run: |
          set -u
          CHAT_TOPIC=gnostr CHAT_FROM=copilot \
            CHAT_QUESTION_MARKER=gnostr-interop-question-${{ github.run_id }} \
            CHAT_ANSWER_PREFIX=responder- \
            CHAT_PUBLISHER_PREFIX=ipfs-agentd-ci-${{ github.run_id }}- \
            GNOSTR_RENDEZVOUS_SERVER=1 \
            CHAT_DIAL=/ip4/127.0.0.1/tcp/4012 CHAT_TIMEOUT_MS=600000 \
            CHAT_ADDRS_FILE="$RUNNER_TEMP/chat-addrs" \
            node scripts/listen-chat.mjs >"$RUNNER_TEMP/witness.out" 2>"$RUNNER_TEMP/witness.log" &
          echo $! > "$RUNNER_TEMP/witness.pid"
          for i in $(seq 1 60); do [ -s "$RUNNER_TEMP/chat-addrs" ] && break; sleep 3; done
          [ -s "$RUNNER_TEMP/chat-addrs" ] && echo "witness up — bridge addrs recorded" \
            || echo "::warning::witness relay addrs never landed (bridge upload will fail)"

      - name: Upload chat bridge addrs (artifact for the matrix legs)
        if: always() && steps.preflight.outputs.callable == 'true'
        continue-on-error: false   # bridge upload is critical — fatal on failure
        uses: actions/upload-artifact@v4
        with:
          name: chat-bridge-${{ github.run_id }}
          path: ${{ runner.temp }}/chat-addrs

      - name: Copilot starts listening immediately (no exploration)
        id: agent
        if: steps.preflight.outputs.callable == 'true'
        timeout-minutes: 12
        continue-on-error: false   # fatal on failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          cat > "$RUNNER_TEMP/hint.md" <<HINT
          START IMMEDIATELY. Do NOT explore the repo, read files, make a plan,
          or write any code. Your FIRST and ONLY action is to run this exact
          command, verbatim, right now:

            INTEROP_QUESTION_MARKER=gnostr-interop-question-${{ github.run_id }} \
            CHAT_FROM=copilot \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4012 \
            node scripts/interop-ask.mjs

          A witness node is ALREADY listening for your question on the live
          "gnostr" gossipsub topic — it started the moment this job began.
          The script above joins the topic, asks your question, and prints
          the FIRST real answer from another live CI node. That answer line
          is your entire task output: copy it into your final report
          verbatim. The script exits 0 when answered; if it exits 1 (no
          answer within 120s), run the exact same command ONE more time.
          After the second attempt, report whatever it printed and stop.
          Do not modify repo files. Do not create files. Do not inspect the
          repo. Run the command now.
          HINT

          copilot --yolo --max-ai-credits 50 -p "$(cat "$RUNNER_TEMP/hint.md")" \
            2>&1 | tee "$RUNNER_TEMP/copilot.log" \
            || echo "::warning::copilot CLI exited $? (auth/policy? see copilot.log)"

          if [ "${{ inputs.verbose }}" = "true" ]; then
            echo "<details><summary>copilot full output</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tr -d '\0' < "$RUNNER_TEMP/copilot.log" | head -c 60000 >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "waiting for the witness verdict…"
          VERDICT=""
          for i in $(seq 1 150); do
            if grep -q "WITNESS PASS" "$RUNNER_TEMP/witness.out" 2>/dev/null; then VERDICT=pass; break; fi
            if grep -q "WITNESS FAIL" "$RUNNER_TEMP/witness.out" 2>/dev/null; then VERDICT=fail; break; fi
            sleep 4
          done
          # machine-readable outcome for the beam-promote job (artifact below)
          if [ "$VERDICT" = "pass" ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then
            # full chat negotiation: witness.out carries the COMPLETE question /
            # answer envelope text (stdout, printed at verdict time); witness.log
            # carries the live QUESTION/ANSWER sightings on the gnostr topic
            echo "::group::chat negotiation — full gnostr envelopes (witness.out + Q&A sightings)"
            cat "$RUNNER_TEMP/witness.out" 2>/dev/null
            grep -E 'witness: (QUESTION|ANSWER) from' "$RUNNER_TEMP/witness.log" 2>/dev/null
            echo "::endgroup::"
            {
              echo "<details><summary>chat negotiation — full gnostr envelopes</summary>"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/witness.out" 2>/dev/null
              grep -E 'witness: (QUESTION|ANSWER) from' "$RUNNER_TEMP/witness.log" 2>/dev/null
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$VERDICT" = "pass" ]; then
            echo copilot > "$RUNNER_TEMP/beam-pass"
            echo "::notice::COPILOT CHAT INTEROP PASS — copilot's question got a real answer from another instance"
            echo "### Copilot chat interop — PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "The witness received Copilot's question AND a \`responder-*\` answer containing the run marker from a **different libp2p peer** on the live gnostr topic." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'witness: (QUESTION|ANSWER) from' "$RUNNER_TEMP/witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::COPILOT CHAT INTEROP FAIL — witness saw no valid Q&A (see witness.log / copilot.log)"
            echo "### Copilot chat interop — FAIL" >> "$GITHUB_STEP_SUMMARY"
            echo 'The witness received no qualifying question+answer pair. Tail of witness.log:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload diagnostics on FAIL (witness + agent logs)
        if: always() && steps.agent.outputs.passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chat-diag-${{ github.run_id }}-copilot
          path: |
            ${{ runner.temp }}/witness.log
            ${{ runner.temp }}/witness.out
            ${{ runner.temp }}/copilot.log
          if-no-files-found: ignore

      - name: Record beam PASS for the promote job
        if: steps.agent.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beam-pass-${{ github.run_id }}-copilot
          path: ${{ runner.temp }}/beam-pass

  # Copilot PAIR leg: TWO Copilot instances exercise the bridge — one asks
  # (interop-ask.mjs), one answers (interop-agent-responder.mjs delegates the
  # answer to a second copilot CLI process), the co-located witness verifies
  # the different-peer exchange. Stands in for the opencode legs while their
  # free-tier quota is exhausted (observed 2026-11-25: "Free usage limit
  # reached" on all three opencode models at preflight).
  copilot-pair:
    if: ${{ github.event_name == 'push' || inputs.copilot == true }}
    name: Copilot pair interop (two agents through the witness)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Node (.nvmrc via setup-node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (retry — registry/GitHub flakes)
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci attempt $i failed — retrying in $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Install Copilot CLI
        run: npm install -g @github/copilot && copilot --version

      - name: Preflight — Copilot CLI present
        id: preflight
        run: |
          set -u
          set +e
          if copilot --version; then
            echo "callable=true" >> "$GITHUB_OUTPUT"
            echo "preflight PASS: copilot CLI runs"
          else
            echo "callable=false" >> "$GITHUB_OUTPUT"
            echo "reason=copilot CLI failed to run (install/GitHub flake)" >> "$GITHUB_OUTPUT"
            echo "::warning::preflight: copilot CLI not runnable"
          fi
          exit 0

      - name: Record leg as unavailable (preflight failed)
        if: steps.preflight.outputs.callable != 'true'
        run: |
          echo "### Copilot pair interop — UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preflight: ${{ steps.preflight.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Start chat witness (detached)
        if: steps.preflight.outputs.callable == 'true'
        run: |
          set -u
          CHAT_TOPIC=gnostr CHAT_FROM=copilot \
            CHAT_QUESTION_MARKER=gnostr-pair-question-${{ github.run_id }} \
            CHAT_ANSWER_PREFIX=responder-copilot \
            CHAT_PUBLISHER_PREFIX=ipfs-agentd-ci-${{ github.run_id }}- \
            GNOSTR_RENDEZVOUS_SERVER=1 \
            CHAT_DIAL=/ip4/127.0.0.1/tcp/4018,/ip4/127.0.0.1/tcp/4019 CHAT_TIMEOUT_MS=600000 \
            node scripts/listen-chat.mjs >"$RUNNER_TEMP/witness.out" 2>"$RUNNER_TEMP/witness.log" &
          echo $! > "$RUNNER_TEMP/witness.pid"
          for i in $(seq 1 60); do grep -q "rendezvous: server up" "$RUNNER_TEMP/witness.log" 2>/dev/null && break; sleep 3; done
          grep -q "rendezvous: server up" "$RUNNER_TEMP/witness.log" && echo "witness up" || echo "::warning::witness did not report ready"

      - name: Start agent responder (detached — copilot instance #2)
        if: steps.preflight.outputs.callable == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          INTEROP_TOPIC=gnostr \
            INTEROP_QUESTION_MARKER=gnostr-pair-question-${{ github.run_id }} \
            COPILOT_FROM=responder-copilot \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4019 \
            WINDOW_MS=600000 \
            node scripts/interop-agent-responder.mjs >"$RUNNER_TEMP/agent-responder.out" 2>"$RUNNER_TEMP/agent-responder.log" &
          echo $! > "$RUNNER_TEMP/agent-responder.pid"
          echo "agent responder pid $(cat "$RUNNER_TEMP/agent-responder.pid")"

      - name: Copilot #1 starts listening immediately (no exploration)
        id: agent
        if: steps.preflight.outputs.callable == 'true'
        timeout-minutes: 14
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          cat > "$RUNNER_TEMP/hint.md" <<HINT
          START IMMEDIATELY. Do NOT explore the repo, read files, make a plan,
          or write any code. Your FIRST and ONLY action is to run this exact
          command, verbatim, right now:

            INTEROP_QUESTION_MARKER=gnostr-pair-question-${{ github.run_id }} \
            CHAT_FROM=copilot \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4018 \
            ASK_KEEPALIVE_MS=360000 \
            node scripts/interop-ask.mjs

          A witness node AND a responder agent are ALREADY listening on the
          live "gnostr" gossipsub topic — both started the moment this job
          began. The responder is another AI agent (its answers contain the
          text "answer from responder-copilot") and it can take up to 4
          minutes to think. The script joins the topic, asks your question,
          and prints the FIRST real answer it captures. Copy that answer
          line into your final report verbatim. The script exits 0 when
          answered; if it exits 1 (no answer within 6 minutes), run the
          exact same command ONE more time. After the second attempt, report
          whatever it printed and stop. Do not modify repo files. Run the
          command now.
          HINT

          copilot --yolo --max-ai-credits 50 -p "$(cat "$RUNNER_TEMP/hint.md")" \
            2>&1 | tee "$RUNNER_TEMP/copilot-asker.log" \
            || echo "::warning::copilot CLI exited $? (auth/policy? see copilot-asker.log)"

          echo "waiting for the witness verdict…"
          VERDICT=""
          for i in $(seq 1 150); do
            if grep -q "WITNESS PASS" "$RUNNER_TEMP/witness.out" 2>/dev/null; then VERDICT=pass; break; fi
            if grep -q "WITNESS FAIL" "$RUNNER_TEMP/witness.out" 2>/dev/null; then VERDICT=fail; break; fi
            sleep 4
          done
          # A witness PASS alone proves nothing about THIS leg: any responder-*
          # peer on the mesh can satisfy it (run 45713689397 PASSed off the
          # matrix leg's responder while copilot #1 captured nothing). The
          # leg is honest only if the ASKER captured the answer text too —
          # interop-ask.mjs writes the captured answer verbatim to stdout.
          ASK_CAPTURED=""
          grep -q "answer from responder-copilot" "$RUNNER_TEMP/copilot-asker.log" 2>/dev/null && ASK_CAPTURED=true
          if [ "$VERDICT" = "pass" ] && [ "$ASK_CAPTURED" = "true" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.verbose }}" = "true" ]; then
            echo "::group::pair leg — witness envelopes + agent responder log"
            cat "$RUNNER_TEMP/witness.out" 2>/dev/null
            grep -E 'witness: (QUESTION|ANSWER) from' "$RUNNER_TEMP/witness.log" 2>/dev/null
            tail -n 20 "$RUNNER_TEMP/agent-responder.log" 2>/dev/null
            echo "::endgroup::"
          fi
          if [ "$VERDICT" = "pass" ] && [ "$ASK_CAPTURED" = "true" ]; then
            echo copilot-pair > "$RUNNER_TEMP/beam-pass"
            echo "::notice::COPILOT PAIR INTEROP PASS — copilot #2 answered copilot #1 over IPFS; the asker captured the answer; witness verified distinct peers"
            echo "### Copilot pair interop — PASS" >> "$GITHUB_STEP_SUMMARY"
            echo 'asker-captured answer:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -m1 "answer from responder-copilot" "$RUNNER_TEMP/copilot-asker.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'witness view:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'witness: (QUESTION|ANSWER) from' "$RUNNER_TEMP/witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::COPILOT PAIR INTEROP FAIL — witness=$VERDICT asker-captured=${ASK_CAPTURED:-false}"
            echo "### Copilot pair interop — FAIL (witness=$VERDICT asker-captured=${ASK_CAPTURED:-false})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/agent-responder.log" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/copilot-asker.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload diagnostics on FAIL
        if: always() && steps.preflight.outputs.callable == 'true' && steps.agent.outputs.passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chat-diag-${{ github.run_id }}-copilot-pair
          path: |
            ${{ runner.temp }}/witness.log
            ${{ runner.temp }}/witness.out
            ${{ runner.temp }}/copilot-asker.log
            ${{ runner.temp }}/agent-responder.log
          if-no-files-found: ignore

      - name: Record beam PASS for the promote job
        if: steps.agent.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beam-pass-${{ github.run_id }}-copilot-pair
          path: ${{ runner.temp }}/beam-pass

  a2aipfs-mesh:
    if: ${{ github.event_name == 'push' || inputs.a2aipfs == true }}
    name: a2aipfs protocol conformance (cold public mesh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Node (.nvmrc via setup-node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (retry — registry/GitHub flakes)
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci attempt $i failed — retrying in $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Start a2aipfs witness (detached)
        run: |
          set -u
          A2AIPFS_ROLE=witness A2AIPFS_TOPIC=a2aipfs/v1/interop-${{ github.run_id }} \
            A2AIPFS_NAME=witness A2AIPFS_TIMEOUT_MS=600000 \
            A2AIPFS_ATTEST_FILE="$RUNNER_TEMP/attest.json" \
            A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4211,/ip4/127.0.0.1/tcp/4212 \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4210 GNOSTR_RENDEZVOUS_SERVER=1 \
            node scripts/a2aipfs-node.mjs >"$RUNNER_TEMP/a2a-witness.out" 2>"$RUNNER_TEMP/a2a-witness.log" &
          echo $! > "$RUNNER_TEMP/a2a-witness.pid"
          sleep 3

      - name: Start a2aipfs responder (detached)
        run: |
          set -u
          A2AIPFS_ROLE=responder A2AIPFS_TOPIC=a2aipfs/v1/interop-${{ github.run_id }} \
            A2AIPFS_NAME=responder A2AIPFS_TIMEOUT_MS=600000 \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4211 \
            A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4210,/ip4/127.0.0.1/tcp/4212 \
            node scripts/a2aipfs-node.mjs >"$RUNNER_TEMP/a2a-responder.out" 2>"$RUNNER_TEMP/a2a-responder.log" &
          echo $! > "$RUNNER_TEMP/a2a-responder.pid"

      - name: Run a2aipfs asker + verdict
        id: agent
        run: |
          set -u
          ASK_EXIT=0
          A2AIPFS_ROLE=asker A2AIPFS_TOPIC=a2aipfs/v1/interop-${{ github.run_id }} \
            A2AIPFS_NAME=asker A2AIPFS_TIMEOUT_MS=420000 \
            A2AIPFS_CARD_TRACE="$RUNNER_TEMP/a2a-card-trace.log" \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4212 \
            A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4210,/ip4/127.0.0.1/tcp/4211 \
            node scripts/a2aipfs-node.mjs >"$RUNNER_TEMP/a2a-asker.out" 2>"$RUNNER_TEMP/a2a-asker.log" || ASK_EXIT=$?
          WITNESS=""
          for i in $(seq 1 60); do
            if grep -q "WITNESS PASS" "$RUNNER_TEMP/a2a-witness.out" 2>/dev/null; then WITNESS=pass; break; fi
            if grep -q "WITNESS FAIL" "$RUNNER_TEMP/a2a-witness.out" 2>/dev/null; then WITNESS=fail; break; fi
            sleep 3
          done
          ATTEST=""
          [ -s "$RUNNER_TEMP/attest.json" ] && ATTEST=yes
          IPFS=""
          if [ "$(grep -c 'IPFS VERIFIED' "$RUNNER_TEMP/a2a-witness.out" 2>/dev/null || echo 0)" -ge 2 ]; then IPFS=pass; fi
          if [ "$ATTEST" = "yes" ]; then
            node -e "const a=require('$RUNNER_TEMP/attest.json');if(!a.payload?.ipfs?.verified)process.exit(1)" || IPFS=fail
          fi
          CARD=""
          CARD_SRC="$RUNNER_TEMP/a2a-asker.log"
          [ -s "$RUNNER_TEMP/a2a-card-trace.log" ] && CARD_SRC="$RUNNER_TEMP/a2a-card-trace.log"
          if grep -q 'CARD RESOLVED via IPNS' "$RUNNER_TEMP/a2a-card-trace.log" 2>/dev/null || grep -q 'CARD RESOLVED via IPNS' "$RUNNER_TEMP/a2a-asker.log" 2>/dev/null; then CARD=pass; fi
          grep -q 'CARD RESOLVED via IPNS' "$CARD_SRC" 2>/dev/null || CARD_SRC="$RUNNER_TEMP/a2a-asker.log"
          if [ "$ASK_EXIT" = "0" ] && [ "$WITNESS" = "pass" ] && [ "$ATTEST" = "yes" ] && [ "$IPFS" = "pass" ] && [ "$CARD" = "pass" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo a2aipfs-mesh > "$RUNNER_TEMP/beam-pass"
            echo "::notice::A2AIPFS MESH PASS — signed query/answer exchange over the cold public mesh, witness attestation produced and verified ON IPFS, Agent Card resolved over IPNS"
            echo "### a2aipfs mesh conformance — PASS" >> "$GITHUB_STEP_SUMMARY"
            echo 'asker-captured answer:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -c 600 "$RUNNER_TEMP/a2a-asker.out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'attest envelope:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/attest.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'on-IPFS verification (witness log):' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep 'IPFS VERIFIED' "$RUNNER_TEMP/a2a-witness.out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'agent card over IPNS (asker log):' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep 'CARD RESOLVED via IPNS' "$CARD_SRC" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A2AIPFS MESH FAIL — asker=$ASK_EXIT witness=${WITNESS:-none} attest=${ATTEST:-no} ipfs=${IPFS:-none} card=${CARD:-none}"
            echo "### a2aipfs mesh conformance — FAIL (asker=$ASK_EXIT witness=${WITNESS:-none} attest=${ATTEST:-no} ipfs=${IPFS:-none} card=${CARD:-none})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/a2a-witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/a2a-responder.log" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/a2a-asker.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload attest + diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2aipfs-attest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/attest.json
            ${{ runner.temp }}/a2a-card-trace.log
            ${{ runner.temp }}/a2a-witness.log
            ${{ runner.temp }}/a2a-witness.out
            ${{ runner.temp }}/a2a-responder.log
            ${{ runner.temp }}/a2a-asker.log
          if-no-files-found: ignore

      - name: Record beam PASS for the promote job
        if: steps.agent.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beam-pass-${{ github.run_id }}-a2aipfs-mesh
          path: ${{ runner.temp }}/beam-pass

  a2aipfs-copilot:
    if: ${{ github.event_name == 'push' || inputs.a2aipfs == true }}
    name: a2aipfs over Copilot agents (AI asker + AI responder, signed attest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Node (.nvmrc via setup-node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (retry — registry/GitHub flakes)
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci attempt $i failed — retrying in $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Install Copilot CLI
        run: npm install -g @github/copilot && copilot --version

      - name: Preflight — Copilot CLI present
        id: preflight
        run: |
          set -u
          set +e
          if copilot --version; then
            echo "callable=true" >> "$GITHUB_OUTPUT"
            echo "preflight PASS: copilot CLI runs"
          else
            echo "callable=false" >> "$GITHUB_OUTPUT"
            echo "reason=copilot CLI failed to run (install/GitHub flake)" >> "$GITHUB_OUTPUT"
            echo "::warning::preflight: copilot CLI not runnable"
          fi
          exit 0

      - name: Record leg as unavailable (preflight failed)
        if: steps.preflight.outputs.callable != 'true'
        run: |
          echo "### a2aipfs over Copilot — UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preflight: ${{ steps.preflight.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Start a2aipfs witness (detached)
        if: steps.preflight.outputs.callable == 'true'
        run: |
          set -u
          A2AIPFS_ROLE=witness A2AIPFS_TOPIC=a2aipfs/v1/copilot-${{ github.run_id }} \
            A2AIPFS_NAME=witness A2AIPFS_TIMEOUT_MS=600000 \
            A2AIPFS_ATTEST_FILE="$RUNNER_TEMP/a2a-attest.json" \
            A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4311,/ip4/127.0.0.1/tcp/4312 \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4310 GNOSTR_RENDEZVOUS_SERVER=1 \
            node scripts/a2aipfs-node.mjs >"$RUNNER_TEMP/a2a-witness.out" 2>"$RUNNER_TEMP/a2a-witness.log" &
          echo $! > "$RUNNER_TEMP/a2a-witness.pid"
          sleep 3

      - name: Start a2aipfs responder (detached — copilot-delegated, spec answer envelopes)
        if: steps.preflight.outputs.callable == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          A2AIPFS_ROLE=responder A2AIPFS_TOPIC=a2aipfs/v1/copilot-${{ github.run_id }} \
            A2AIPFS_NAME=a2aipfs-responder-copilot A2AIPFS_DELEGATE=copilot \
            A2AIPFS_TIMEOUT_MS=600000 \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4311 \
            A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4310,/ip4/127.0.0.1/tcp/4312 \
            node scripts/a2aipfs-node.mjs >"$RUNNER_TEMP/a2a-responder.out" 2>"$RUNNER_TEMP/a2a-responder.log" &
          echo $! > "$RUNNER_TEMP/a2a-responder.pid"

      - name: Copilot #1 runs the a2aipfs asker (spec query envelopes)
        id: agent
        if: steps.preflight.outputs.callable == 'true'
        timeout-minutes: 16
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          cat > "$RUNNER_TEMP/a2a-hint.md" <<HINT
          START IMMEDIATELY. Do NOT explore the repo, read files, make a plan,
          or write any code. Your FIRST and ONLY action is to run this exact
          command, verbatim, right now:

            A2AIPFS_ROLE=asker A2AIPFS_TOPIC=a2aipfs/v1/copilot-${{ github.run_id }} \
              A2AIPFS_NAME=asker A2AIPFS_TIMEOUT_MS=420000 \
              A2AIPFS_CARD_TRACE="$RUNNER_TEMP/a2a-card-trace.log" \
              GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4312 \
              A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4310,/ip4/127.0.0.1/tcp/4311 \
              node scripts/a2aipfs-node.mjs

          A witness node AND a responder agent are ALREADY listening on the
          live a2aipfs topic — both started the moment this job began. The
          responder is another AI agent (its signed answers contain the text
          "answer from a2aipfs-responder-copilot") and it can take up to 4
          minutes to think. The script joins the topic, publishes your
          signed query, and prints the FIRST verified answer it captures.
          Copy that answer line into your final report verbatim. The script
          exits 0 when answered; if it exits 1 (no answer within 7 minutes),
          run the exact same command ONE more time. After the second
          attempt, report whatever it printed and stop. Do not modify repo
          files. Run the command now.
          HINT

          copilot --yolo --max-ai-credits 50 -p "$(cat "$RUNNER_TEMP/a2a-hint.md")" \
            2>&1 | tee "$RUNNER_TEMP/copilot-a2a-asker.log" \
            || echo "::warning::copilot CLI exited $? (auth/policy? see copilot-a2a-asker.log)"

          echo "waiting for the witness verdict…"
          VERDICT=""
          for i in $(seq 1 120); do
            if grep -q "WITNESS PASS" "$RUNNER_TEMP/a2a-witness.out" 2>/dev/null; then VERDICT=pass; break; fi
            if grep -q "WITNESS FAIL" "$RUNNER_TEMP/a2a-witness.out" 2>/dev/null; then VERDICT=fail; break; fi
            sleep 4
          done
          ASK_CAPTURED=""
          grep -q "answer from a2aipfs-responder-copilot" "$RUNNER_TEMP/copilot-a2a-asker.log" 2>/dev/null && ASK_CAPTURED=true
          ATTEST=""
          [ -s "$RUNNER_TEMP/a2a-attest.json" ] && ATTEST=yes
          DELEGATED=""
          grep -q '"name": "a2aipfs-responder-copilot"' "$RUNNER_TEMP/a2a-attest.json" 2>/dev/null && DELEGATED=yes
          IPFS=""
          if [ "$(grep -c 'IPFS VERIFIED' "$RUNNER_TEMP/a2a-witness.out" 2>/dev/null || echo 0)" -ge 2 ]; then IPFS=pass; fi
          if [ "$ATTEST" = "yes" ]; then
            node -e "const a=require('$RUNNER_TEMP/a2a-attest.json');if(!a.payload?.ipfs?.verified)process.exit(1)" || IPFS=fail
          fi
          CARD=""
          CARD_SRC="$RUNNER_TEMP/copilot-a2a-asker.log"
          [ -s "$RUNNER_TEMP/a2a-card-trace.log" ] && CARD_SRC="$RUNNER_TEMP/a2a-card-trace.log"
          if grep -q 'CARD RESOLVED via IPNS' "$RUNNER_TEMP/a2a-card-trace.log" 2>/dev/null || grep -q 'CARD RESOLVED via IPNS' "$RUNNER_TEMP/copilot-a2a-asker.log" 2>/dev/null || grep -q 'CARD RESOLVED via IPNS' "$RUNNER_TEMP/a2a-witness.log" 2>/dev/null; then CARD=pass; fi
          grep -q 'CARD RESOLVED via IPNS' "$CARD_SRC" 2>/dev/null || CARD_SRC="$RUNNER_TEMP/copilot-a2a-asker.log"
          grep -q 'CARD RESOLVED via IPNS' "$CARD_SRC" 2>/dev/null || CARD_SRC="$RUNNER_TEMP/a2a-witness.log"
          if [ "$VERDICT" = "pass" ] && [ "$ASK_CAPTURED" = "true" ] && [ "$ATTEST" = "yes" ] && [ "$DELEGATED" = "yes" ] && [ "$IPFS" = "pass" ] && [ "$CARD" = "pass" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo a2aipfs-copilot > "$RUNNER_TEMP/beam-pass"
            echo "::notice::A2AIPFS COPILOT PASS — two Copilot agents exchanged signed a2aipfs query/answer envelopes; witness attestation verified the responder identity; Agent Card resolved over IPNS"
            echo "### a2aipfs over Copilot — PASS" >> "$GITHUB_STEP_SUMMARY"
            echo 'asker-captured answer:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -m1 "answer from a2aipfs-responder-copilot" "$RUNNER_TEMP/copilot-a2a-asker.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'attest envelope:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/a2a-attest.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'agent card over IPNS (asker log):' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep 'CARD RESOLVED via IPNS' "$CARD_SRC" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A2AIPFS COPILOT FAIL — witness=$VERDICT asker-captured=${ASK_CAPTURED:-false} attest=${ATTEST:-no} delegated-identity=${DELEGATED:-no} ipfs=${IPFS:-none} card=${CARD:-none}"
            echo "### a2aipfs over Copilot — FAIL (witness=$VERDICT asker-captured=${ASK_CAPTURED:-false} attest=${ATTEST:-no} delegated-identity=${DELEGATED:-no} ipfs=${IPFS:-none} card=${CARD:-none})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/a2a-witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/a2a-responder.log" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/copilot-a2a-asker.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload attest + diagnostics
        if: always() && steps.preflight.outputs.callable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a2aipfs-copilot-attest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/a2a-attest.json
            ${{ runner.temp }}/a2a-witness.log
            ${{ runner.temp }}/a2a-witness.out
            ${{ runner.temp }}/a2a-responder.log
            ${{ runner.temp }}/copilot-a2a-asker.log
            ${{ runner.temp }}/a2a-card-trace.log
          if-no-files-found: ignore

      - name: Record beam PASS for the promote job
        if: steps.agent.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beam-pass-${{ github.run_id }}-a2aipfs-copilot
          path: ${{ runner.temp }}/beam-pass

  # OpenCode leg model resolution. The dispatch dropdown can't be populated
  # from a live query, so this job does it in-workflow and the legs consume
  # its output as a dynamic matrix. Precedence:
  #   opencode_models (comma list) -> one leg per model
  #   opencode_model  (single)     -> one leg
  #   else                         -> `opencode models` LIVE catalog, the
  #                                   opencode/ (Zen) models, free-tagged
  #                                   first, else the first 3 — the catalog
  #                                   rotates, never hardcode
  opencode-catalog:
    name: OpenCode model catalog (resolve legs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      models: ${{ steps.resolve.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm   # also covers `npm install -g @opencode/cli` below (same ~/.npm cache)

      - name: Install OpenCode CLI
        run: npm install -g @opencode/cli && opencode --version

      # AUTH: the OPENCODE repo secret IS the opencode.ai/console token.
      # (The OIDC token-exchange sign-in and its client_id were removed after
      # GitHub secret scanning flagged the client_id — secret-scanning/1.
      # No repo variable needed; rotate by updating the OPENCODE secret.)
      # Writes OPENCODE_API_KEY to $GITHUB_ENV for every later step in
      # THIS job.
      - name: Sign in to OpenCode
        env:
          OPENCODE_TOKEN: ${{ secrets.OPENCODE }}
        run: |
          set -u
          echo "::add-mask::$OPENCODE_TOKEN"
          echo "OPENCODE_API_KEY=$OPENCODE_TOKEN" >> "$GITHUB_ENV"

      - id: resolve
        # OPENCODE_API_KEY arrives via $GITHUB_ENV (sign-in step above) —
        # do NOT set it here or it would override it. The
        # other provider names stay so a swapped secret keeps working.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE }}
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENROUTER_API_KEY: ${{ secrets.OPENCODE }}
          GEMINI_API_KEY: ${{ secrets.OPENCODE }}
        run: |
          set -u
          MODELS='${{ inputs.opencode_models }}'
          SINGLE='${{ inputs.opencode_model }}'
          # catalog helper: strip ANSI, first column only, must look like an id
          catalog() {
            opencode models 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | awk '{print $1}' | grep / | grep -v '^provider'
          }
          if [ -n "$MODELS" ]; then
            json=''; sep=''
            IFS=','
            for m in $MODELS; do
              m=$(echo "$m" | tr -d ' ')
              if [ -n "$m" ]; then json="$json$sep\"$m\""; sep=','; fi
            done
            unset IFS
            echo "models=[$json]" >> "$GITHUB_OUTPUT"
            echo "opencode legs (dispatch list): [$json]"
          elif [ -n "$SINGLE" ]; then
            echo "models=[\"$SINGLE\"]" >> "$GITHUB_OUTPUT"
            echo "opencode legs (single): $SINGLE"
          else
            # OPENCODE secret = Zen key → the callable free models live on
            # the opencode/ provider (opencode-go/ needs a GO subscription,
            # so '^opencode/' deliberately excludes it). Prefer ids tagged
            # free, fall back to the first 3 opencode/ models.
            free=$(catalog | grep '^opencode/' | grep -i free | head -3 || true)
            [ -z "$free" ] && free=$(catalog | grep '^opencode/' | head -3 || true)
            json=''; sep=''
            for m in $free; do json="$json$sep\"$m\""; sep=','; done
            echo "models=[$json]" >> "$GITHUB_OUTPUT"
            echo "opencode legs (zen free catalog): [${json}]"
            if [ -z "$json" ]; then
              echo "::warning::no opencode/ models in the live catalog -- set opencode_model / opencode_models, or check the OPENCODE secret"
            fi
          fi
          exit 0   # resolve must NEVER fail: legs consume its output

  # Second beam of the model interop PoC (copilot-chat is the first): the
  # OpenCode CLI gets the SAME hint-driven treatment -- no prior knowledge,
  # must read the repo, figure out the gossipsub chat, ask a run-marked
  # question on the live gnostr topic and receive a REAL answer from a
  # matrix leg's responder. One job instance PER RESOLVED MODEL (dynamic
  # matrix from opencode-catalog); each has its own witness + bridge
  # artifact (suffixed -opencode-<model slug>), marker and listen port
  # (4017 -- the hint puts OpenCode's node there so the witness dial is
  # deterministic; per-runner, so matrix legs don't collide). Auth: the
  # OPENCODE repo secret is exposed under OPENCODE_API_KEY (Zen key), plus
  # OPENAI/OPENROUTER/GEMINI names for a swapped secret — see the inputs
  # comment. NON-FATAL: orange.
  opencode-chat:
    needs: opencode-catalog
    # TEMPORARY (2026-11-25): opencode free-tier quota exhausted — every
    # model fails preflight with "Free usage limit reached". The copilot-pair
    # leg exercises the bridge in the meantime. Re-enable by restoring the
    # gate below when a provider is connected to the OPENCODE secret.
    if: ${{ false && needs.opencode-catalog.outputs.models != '[]' && needs.opencode-catalog.outputs.models != '' }}
    name: OpenCode chat interop -- ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.opencode-catalog.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Node (.nvmrc via setup-node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (retry -- registry/GitHub flakes)
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci attempt $i failed -- retrying in $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Install OpenCode CLI
        run: npm install -g @opencode/cli && opencode --version

      # same secret-based sign-in as opencode-catalog — $GITHUB_ENV is
      # per-job, so every matrix leg writes its own OPENCODE_API_KEY (flows
      # to the preflight and agent steps; do NOT set it in step env)
      - name: Sign in to OpenCode
        env:
          OPENCODE_TOKEN: ${{ secrets.OPENCODE }}
        run: |
          set -u
          echo "::add-mask::$OPENCODE_TOKEN"
          echo "OPENCODE_API_KEY=$OPENCODE_TOKEN" >> "$GITHUB_ENV"

      # cheap gate BEFORE the witness starts: a doomed leg must fail fast
      # (~1 min, orange) with the API error visible, not burn the full
      # 12-min timeout. Probes: (1) HTTP key/quota probe per provider,
      # (2) a minimal `opencode run` of the EXACT model id, retried x2 —
      # separates auth/quota (fix the secret) from GitHub flakes (retry).
      - name: Preflight — is ${{ matrix.model }} callable?
        id: preflight
        timeout-minutes: 4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE }}
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENROUTER_API_KEY: ${{ secrets.OPENCODE }}
          GEMINI_API_KEY: ${{ secrets.OPENCODE }}
        run: |
          set -u
          set +e   # we guard explicitly and ALWAYS write the outputs
          REASON=""
          MODEL='${{ matrix.model }}'
          PROVIDER=${MODEL%%/*}
          # (1) HTTP probe: connectivity + key validity + quota in one request
          case "$PROVIDER" in
            opencode)
              URL="https://opencode.ai/zen/v1/models"; KEY="$OPENCODE_API_KEY" ;;
            openai)
              URL="$OPENAI_BASE_URL/models"; KEY="$OPENAI_API_KEY" ;;
            openrouter)
              URL="https://openrouter.ai/api/v1/models"; KEY="$OPENROUTER_API_KEY" ;;
            *) URL="" ;;
          esac
          if [ -n "$URL" ]; then
            HTTP=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/preflight-http.json" -w '%{http_code}' \
                     "$URL" -H "Authorization: Bearer $KEY" 2>"$RUNNER_TEMP/preflight-http.err")
            case "$HTTP" in
              200) echo "preflight http: 200 (key valid)" ;;
              401|403) REASON="$PROVIDER key rejected (HTTP $HTTP): $(head -c 300 "$RUNNER_TEMP/preflight-http.json" 2>/dev/null)" ;;
              429) REASON="$PROVIDER quota exhausted (HTTP 429): $(head -c 300 "$RUNNER_TEMP/preflight-http.json" 2>/dev/null)" ;;
              *) REASON="$PROVIDER http probe failed (code '${HTTP:-curl-error}'): $(head -c 200 "$RUNNER_TEMP/preflight-http.err" 2>/dev/null)" ;;
            esac
          else
            echo "preflight http: no probe for provider '$PROVIDER' — opencode probe decides"
          fi
          # (2) opencode probe of the exact model id (retried: GitHub flakes)
          if [ -z "$REASON" ]; then
            for attempt in 1 2 3; do
              OUT=$(timeout 90 opencode run --standalone --model "$MODEL" "Reply with exactly: ok" 2>&1)
              RC=$?
              if [ $RC -eq 0 ] && [ -n "$(printf '%s' "$OUT" | tr -d '[:space:]')" ]; then
                echo "preflight opencode: callable (attempt $attempt)"
                REASON=""
                break
              fi
              echo "preflight opencode attempt $attempt failed (rc=$RC): $(printf '%s' "$OUT" | tail -c 300)"
              REASON="opencode run failed for $MODEL (rc=$RC): $(printf '%s' "$OUT" | tail -c 300)"
              [ $attempt -lt 3 ] && sleep $((attempt*15))
            done
          fi
          if [ -z "$REASON" ]; then
            echo "callable=true" >> "$GITHUB_OUTPUT"
            echo "preflight PASS: $MODEL callable"
          else
            echo "callable=false" >> "$GITHUB_OUTPUT"
            echo "reason=$(printf '%s' "$REASON" | tr '\n' ' ' | cut -c1-400)" >> "$GITHUB_OUTPUT"
            echo "::warning::preflight: $MODEL NOT callable — $(printf '%s' "$REASON" | tr '\n' ' ' | cut -c1-300)"
          fi
          exit 0   # preflight NEVER fails the job; it gates the expensive steps

      - name: Record leg as unavailable (preflight failed)
        if: steps.preflight.outputs.callable != 'true'
        continue-on-error: false   # fatal — the run goes red on failure
        run: |
          echo "### OpenCode chat interop — ${{ matrix.model }} — UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preflight: ${{ steps.preflight.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Auth/quota failure → fix the OPENCODE secret; transient failure → re-run." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # artifact names reject ':' etc. -- slug the model id for the marker and
      # the bridge artifact (the responder matches the base marker, so the
      # suffix only needs to be unique per leg)
      - name: Slug the model id
        if: steps.preflight.outputs.callable == 'true'
        run: |
          SLUG=$(echo '${{ matrix.model }}' | tr -cs 'a-zA-Z0-9._-' '-')
          echo "slug=$SLUG" >> "$GITHUB_ENV"
          echo "model=${{ matrix.model }} slug=$SLUG"

      - name: Start chat witness (detached) and record bridge addrs
        if: steps.preflight.outputs.callable == 'true'
        run: |
          set -u
          CHAT_TOPIC=gnostr CHAT_FROM=opencode \
            CHAT_QUESTION_MARKER=gnostr-opencode-question-${{ github.run_id }}-${{ env.slug }} \
            CHAT_ANSWER_PREFIX=responder- \
            CHAT_PUBLISHER_PREFIX=ipfs-agentd-ci-${{ github.run_id }}- \
            GNOSTR_RENDEZVOUS_SERVER=1 \
            CHAT_DIAL=/ip4/127.0.0.1/tcp/4017 CHAT_TIMEOUT_MS=600000 \
            CHAT_ADDRS_FILE="$RUNNER_TEMP/chat-addrs" \
            node scripts/listen-chat.mjs >"$RUNNER_TEMP/witness.out" 2>"$RUNNER_TEMP/witness.log" &
          echo $! > "$RUNNER_TEMP/witness.pid"
          for i in $(seq 1 60); do [ -s "$RUNNER_TEMP/chat-addrs" ] && break; sleep 3; done
          [ -s "$RUNNER_TEMP/chat-addrs" ] && echo "witness up -- bridge addrs recorded" \
            || echo "::warning::witness relay addrs never landed (bridge upload will fail)"

      - name: Upload chat bridge addrs (artifact for the matrix legs)
        if: always() && steps.preflight.outputs.callable == 'true'
        continue-on-error: false   # bridge upload is critical — fatal on failure
        uses: actions/upload-artifact@v4
        with:
          name: chat-bridge-${{ github.run_id }}-opencode-${{ env.slug }}
          path: ${{ runner.temp }}/chat-addrs

      - name: OpenCode starts listening immediately (no exploration)
        id: agent
        if: steps.preflight.outputs.callable == 'true'
        timeout-minutes: 12
        continue-on-error: false   # fatal on failure
        # OPENCODE_API_KEY arrives via $GITHUB_ENV (sign-in step) —
        # do NOT set it here. The other provider names stay
        # so explicit opencode_models for those providers work
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE }}
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENROUTER_API_KEY: ${{ secrets.OPENCODE }}
          GEMINI_API_KEY: ${{ secrets.OPENCODE }}
        run: |
          set -u
          cat > "$RUNNER_TEMP/hint.md" <<HINT
          START IMMEDIATELY. Do NOT explore the repo, read files, make a plan,
          or write any code. Your FIRST and ONLY action is to run this exact
          command, verbatim, right now:

            INTEROP_QUESTION_MARKER=gnostr-opencode-question-${{ github.run_id }}-${{ env.slug }} \
            CHAT_FROM=opencode \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4017 \
            CHAT_ADDRS_FILE="$RUNNER_TEMP/chat-addrs" \
            node scripts/interop-ask.mjs

          A witness node is ALREADY listening for your question on the live
          "gnostr" gossipsub topic -- it started the moment this job began.
          The script joins the topic, asks your question, and prints the
          FIRST real answer from another live CI node. That answer line is
          your entire task output: copy it into your final report verbatim.
          The script exits 0 when answered; if it exits 1 (no answer within
          120s), run the exact same command ONE more time. After the second
          attempt, report whatever it printed and stop.
          Do not modify repo files. Do not create files. Do not inspect the
          repo. Run the command now.
          HINT

          VERBOSE_ARGS=""
          if [ "${{ inputs.verbose }}" = "true" ]; then
            # --thinking: show thinking blocks; --print-logs: server logs to stderr
            VERBOSE_ARGS="--thinking --print-logs"
          fi
          # shellcheck disable=SC2086
          opencode run --standalone $VERBOSE_ARGS --model "${{ matrix.model }}" "$(cat "$RUNNER_TEMP/hint.md")" \
            2>&1 | tee "$RUNNER_TEMP/opencode.log" \
            || echo "::warning::opencode CLI exited $? (auth/model? see opencode.log)"

          if [ "${{ inputs.verbose }}" = "true" ]; then
            echo "<details><summary>opencode (${{ matrix.model }}) full transcript — thinking + logs</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tr -d '\0' < "$RUNNER_TEMP/opencode.log" | head -c 60000 >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "waiting for the witness verdict..."
          VERDICT=""
          for i in $(seq 1 150); do
            if grep -q "WITNESS PASS" "$RUNNER_TEMP/witness.out" 2>/dev/null; then VERDICT=pass; break; fi
            if grep -q "WITNESS FAIL" "$RUNNER_TEMP/witness.out" 2>/dev/null; then VERDICT=fail; break; fi
            sleep 4
          done
          # machine-readable outcome for the beam-promote job (artifact below)
          if [ "$VERDICT" = "pass" ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then
            # full chat negotiation: witness.out carries the COMPLETE question /
            # answer envelope text (stdout, printed at verdict time); witness.log
            # carries the live QUESTION/ANSWER sightings on the gnostr topic
            echo "::group::chat negotiation — full gnostr envelopes (witness.out + Q&A sightings)"
            cat "$RUNNER_TEMP/witness.out" 2>/dev/null
            grep -E 'witness: (QUESTION|ANSWER) from' "$RUNNER_TEMP/witness.log" 2>/dev/null
            echo "::endgroup::"
            {
              echo "<details><summary>chat negotiation — full gnostr envelopes</summary>"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/witness.out" 2>/dev/null
              grep -E 'witness: (QUESTION|ANSWER) from' "$RUNNER_TEMP/witness.log" 2>/dev/null
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$VERDICT" = "pass" ]; then
            echo "${{ matrix.model }}" > "$RUNNER_TEMP/beam-pass"
            echo "::notice::OPENCODE CHAT INTEROP PASS -- opencode (${{ matrix.model }}) got a real answer from another instance"
            echo "### OpenCode chat interop -- ${{ matrix.model }} -- PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "The witness received OpenCode's question AND a \`responder-*\` answer containing the run marker from a **different libp2p peer** on the live gnostr topic." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'witness: (QUESTION|ANSWER) from' "$RUNNER_TEMP/witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::OPENCODE CHAT INTEROP FAIL -- witness saw no valid Q&A (see witness.log / opencode.log)"
            echo "### OpenCode chat interop -- ${{ matrix.model }} -- FAIL" >> "$GITHUB_STEP_SUMMARY"
            echo 'The witness received no qualifying question+answer pair. Tail of witness.log:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload diagnostics on FAIL (witness + agent logs)
        # job logs and step summaries need repo auth to read from outside —
        # an artifact keeps the failure diagnosable for anyone
        if: always() && steps.preflight.outputs.callable == 'true' && steps.agent.outputs.passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chat-diag-${{ github.run_id }}-opencode-${{ env.slug }}
          path: |
            ${{ runner.temp }}/witness.log
            ${{ runner.temp }}/witness.out
            ${{ runner.temp }}/opencode.log
          if-no-files-found: ignore

      - name: Record beam PASS for the promote job
        if: steps.agent.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beam-pass-${{ github.run_id }}-opencode-${{ env.slug }}
          path: ${{ runner.temp }}/beam-pass

  a2aipfs-task:
    if: ${{ github.event_name == 'push' || inputs.a2aipfs == true }}
    name: a2aipfs task lifecycle (task → hash-chained stream-chunks → acks → done)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Node (.nvmrc via setup-node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (retry — registry/GitHub flakes)
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci attempt $i failed — retrying in $((i*10))s"
            sleep $((i*10))
          done
          exit 1

      - name: Start task witness (detached)
        run: |
          set -u
          A2AIPFS_ROLE=witness A2AIPFS_TOPIC=a2aipfs/v1/task-${{ github.run_id }} \
            A2AIPFS_NAME=task-witness A2AIPFS_TIMEOUT_MS=600000 \
            A2AIPFS_TASK_FILE="$RUNNER_TEMP/task-attest.json" \
            A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4411,/ip4/127.0.0.1/tcp/4412 \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4410 GNOSTR_RENDEZVOUS_SERVER=1 \
            node scripts/a2aipfs-node.mjs >"$RUNNER_TEMP/task-witness.out" 2>"$RUNNER_TEMP/task-witness.log" &
          echo $! > "$RUNNER_TEMP/task-witness.pid"
          sleep 3

      - name: Start task worker (detached)
        run: |
          set -u
          A2AIPFS_ROLE=worker A2AIPFS_TOPIC=a2aipfs/v1/task-${{ github.run_id }} \
            A2AIPFS_NAME=a2aipfs-task-worker A2AIPFS_TIMEOUT_MS=600000 \
            A2AIPFS_CHUNKS=5 \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4411 \
            A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4410,/ip4/127.0.0.1/tcp/4412 \
            node scripts/a2aipfs-node.mjs >"$RUNNER_TEMP/task-worker.out" 2>"$RUNNER_TEMP/task-worker.log" &
          echo $! > "$RUNNER_TEMP/task-worker.pid"

      - name: Run task asker + verdict
        id: agent
        run: |
          set -u
          ASK_EXIT=0
          A2AIPFS_ROLE=asker A2AIPFS_TASK=1 A2AIPFS_TOPIC=a2aipfs/v1/task-${{ github.run_id }} \
            A2AIPFS_NAME=task-asker A2AIPFS_CARD_TRACE="$RUNNER_TEMP/a2a-card-trace.log" A2AIPFS_TIMEOUT_MS=420000 A2AIPFS_CHUNKS=5 \
            GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4412 \
            A2AIPFS_DIAL=/ip4/127.0.0.1/tcp/4410,/ip4/127.0.0.1/tcp/4411 \
            node scripts/a2aipfs-node.mjs >"$RUNNER_TEMP/task-asker.out" 2>"$RUNNER_TEMP/task-asker.log" || ASK_EXIT=$?
          WITNESS=""
          for i in $(seq 1 60); do
            if grep -q "WITNESS PASS" "$RUNNER_TEMP/task-witness.out" 2>/dev/null; then WITNESS=pass; break; fi
            if grep -q "WITNESS FAIL" "$RUNNER_TEMP/task-witness.out" 2>/dev/null; then WITNESS=fail; break; fi
            sleep 3
          done
          TASKFILE=""
          [ -s "$RUNNER_TEMP/task-attest.json" ] && TASKFILE=yes
          IPFS=""
          if [ "$(grep -c 'IPFS VERIFIED' "$RUNNER_TEMP/task-witness.out" 2>/dev/null || echo 0)" -ge 2 ]; then IPFS=pass; fi
          if [ "$TASKFILE" = "yes" ]; then
            node -e "const a=require('$RUNNER_TEMP/task-attest.json');if(!a.ipfs?.verified)process.exit(1)" || IPFS=fail
          fi
          VERIFY=""
          if [ "$TASKFILE" = "yes" ]; then
            if node test/a2aipfs-task-verify.mjs "$RUNNER_TEMP/task-attest.json" >"$RUNNER_TEMP/task-verify.out" 2>&1; then VERIFY=pass; else VERIFY=fail; fi
          fi
          CARD=""
          CARD_SRC="$RUNNER_TEMP/task-asker.log"
          [ -s "$RUNNER_TEMP/a2a-card-trace.log" ] && CARD_SRC="$RUNNER_TEMP/a2a-card-trace.log"
          if grep -q 'CARD RESOLVED via IPNS' "$RUNNER_TEMP/a2a-card-trace.log" 2>/dev/null || grep -q 'CARD RESOLVED via IPNS' "$RUNNER_TEMP/task-asker.log" 2>/dev/null; then CARD=pass; fi
          grep -q 'CARD RESOLVED via IPNS' "$CARD_SRC" 2>/dev/null || CARD_SRC="$RUNNER_TEMP/task-asker.log"
          if [ "$ASK_EXIT" = "0" ] && grep -q "task complete: received 5 chunks" "$RUNNER_TEMP/task-asker.out" \
            && [ "$WITNESS" = "pass" ] && [ "$TASKFILE" = "yes" ] && [ "$VERIFY" = "pass" ] && [ "$IPFS" = "pass" ] && [ "$CARD" = "pass" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo a2aipfs-task > "$RUNNER_TEMP/beam-pass"
            echo "::notice::A2AIPFS TASK PASS — task → 5 hash-chained stream-chunks over the direct stream → acks → task-state done, witness attested ON IPFS, independent verify green, Agent Card resolved over IPNS"
            echo "### a2aipfs task lifecycle — PASS" >> "$GITHUB_STEP_SUMMARY"
            echo 'asker verdict line:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -c 600 "$RUNNER_TEMP/task-asker.out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'independent verifier:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/task-verify.out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'on-IPFS verification (witness log):' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep 'IPFS VERIFIED' "$RUNNER_TEMP/task-witness.out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'agent card over IPNS (asker log):' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep 'CARD RESOLVED via IPNS' "$CARD_SRC" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A2AIPFS TASK FAIL — asker=$ASK_EXIT witness=${WITNESS:-none} attest=${TASKFILE:-no} verify=${VERIFY:-skipped} ipfs=${IPFS:-none} card=${CARD:-none}"
            echo "### a2aipfs task lifecycle — FAIL (asker=$ASK_EXIT witness=${WITNESS:-none} attest=${TASKFILE:-no} verify=${VERIFY:-skipped} ipfs=${IPFS:-none} card=${CARD:-none})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/task-witness.log" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/task-worker.log" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 "$RUNNER_TEMP/task-asker.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload task attest + diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2aipfs-task-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/task-attest.json
            ${{ runner.temp }}/a2a-card-trace.log
            ${{ runner.temp }}/task-verify.out
            ${{ runner.temp }}/task-witness.log
            ${{ runner.temp }}/task-witness.out
            ${{ runner.temp }}/task-worker.log
            ${{ runner.temp }}/task-asker.log
          if-no-files-found: ignore

      - name: Record beam PASS for the promote job
        if: steps.agent.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beam-pass-${{ github.run_id }}-a2aipfs-task
          path: ${{ runner.temp }}/beam-pass

  # If ANY model-beam leg got a WITNESS PASS (recorded as a beam-pass-<run_id>
  # artifact), land a patch version bump on master. The commit is UNSIGNED by
  # necessity — the project's GPG key never leaves the maintainer's control;
  # per convention the maintainer tags manually (signed) to trigger release.
  # Opt out with the bump_on_pass input. Concurrency-guarded so two passing
  # dispatches can't race the push.
  beam-promote:
    name: Beam promote — version bump on PASS
    if: always() && (inputs.bump_on_pass == true || github.event_name == 'push')
    needs: [copilot-chat, copilot-pair, a2aipfs-mesh, a2aipfs-copilot, a2aipfs-task]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: beam-promote
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Look for a beam-pass artifact
        id: pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          names=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' 2>/dev/null | grep "^beam-pass-${{ github.run_id }}" || true)
          if [ -z "$names" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no beam-pass artifact — the model beam did not PASS, no bump"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "beam PASS recorded by: $(echo "$names" | tr '\n' ' ')"
          fi

      - name: Bump patch version on master
        if: steps.pass.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OLD=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          NEW=$(node -p "require('./package.json').version")
          # keep the three version sites in sync (package.json via npm; the
          # other two guarded — drift warns instead of silently missing)
          if grep -q "version: '$OLD'" src/daemon.js; then
            sed -i "s/version: '$OLD'/version: '$NEW'/" src/daemon.js
          else
            echo "::warning::src/daemon.js has no 'version: \"$OLD\"' — check version drift"
          fi
          if grep -q "ipfs-agentd/$OLD" src/tools.js; then
            sed -i "s#ipfs-agentd/$OLD#ipfs-agentd/$NEW#" src/tools.js
          else
            echo "::warning::src/tools.js has no 'ipfs-agentd/$OLD' — check version drift"
          fi
          git add package.json package-lock.json src/daemon.js src/tools.js
          git commit -m "chore: bump version to $NEW (model beam interop pass, run ${{ github.run_id }})"
          git push origin master
          echo "::notice::version bumped $OLD -> $NEW on master — tag manually (signed) to release"
          {
            echo "### Beam promote"
            echo ""
            echo "Model beam interop **PASS** (run ${{ github.run_id }}) — version bumped **$OLD → $NEW** on master (unsigned bot commit). Tag manually (signed) to trigger the release."
          } >> "$GITHUB_STEP_SUMMARY"
