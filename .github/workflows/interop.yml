name: interop

# Live interop, dispatch-only with per-OS select (default linux):
# each selected runner hosts two independent ipfs-agentd nodes plus the real
# git-remote-gnostr CLI helper; the linux leg additionally builds the Docker
# image and joins the container itself as an independent peer.
#   1. publisher daemon seeds a git bundle for INTEROP_LIVE_SECS and re-announces
#      it on the real "gnostr" topic every 15s (externally observable)
#   2. a second, independent node fetches the bundle by CID (bitswap, direct dial)
#      and by name (topic discovery)
#   3. the real git-remote-gnostr helper clones gnostr://cid/<CID> with plain git
#   4. linux only: a Docker container runs the fetcher and the helper clone
# The job then waits out the live window so external peers can confirm the ad.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to check out and interop-test (e.g. master, v0.3.2)'
        default: 'master'
      live_seconds:
        description: 'How long the publisher keeps seeding (seconds)'
        default: '900'
      linux:
        description: 'Run on ubuntu-latest (includes Docker peer leg)'
        type: boolean
        default: true
      windows:
        description: 'Run on windows-latest'
        type: boolean
        default: false
      macos:
        description: 'Run on macos-latest'
        type: boolean
        default: false

env:
  INTEROP_LIVE_SECS: ${{ github.event.inputs.live_seconds || '900' }}

jobs:
  # build the runner matrix from the per-OS selects; empty → whole workflow skips
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        run: |
          include='[]'
          if [ "${{ inputs.linux }}"   = "true" ]; then include=$(echo "$include" | jq '. + [{"os":"ubuntu-latest",  "docker":true}]');  fi
          if [ "${{ inputs.windows }}" = "true" ]; then include=$(echo "$include" | jq '. + [{"os":"windows-latest", "docker":false}]'); fi
          if [ "${{ inputs.macos }}"   = "true" ]; then include=$(echo "$include" | jq '. + [{"os":"macos-latest",   "docker":false}]'); fi
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "matrix: $include"

  live-interop:
    needs: matrix
    if: needs.matrix.outputs.include != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Node (unix — nvm per .nvmrc)
        if: runner.os != 'Windows'
        uses: ./.github/actions/install-nvm
      - name: Node (windows)
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v4
        if: runner.os != 'Windows'
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund

      - name: Start publisher daemon (background seeder)
        run: |
          mkdir -p /tmp/interop
          GNOSTR_LISTEN=/ip4/127.0.0.1/tcp/4011 \
          INTEROP_REPO=$GITHUB_WORKSPACE \
          INTEROP_NAME=ipfs-agentd-ci-${{ github.run_id }}-${{ matrix.os }} \
          node test/interop-publisher.mjs 2>/tmp/interop/publisher.log &
          echo $! > /tmp/interop-pub.pid
          echo "publisher pid $(cat /tmp/interop-pub.pid), live window ${{ env.INTEROP_LIVE_SECS }}s"

      - name: Wait for publisher readiness
        timeout-minutes: 3
        run: |
          for i in $(seq 1 60); do [ -f /tmp/interop/cid ] && break; sleep 2; done
          if [ ! -f /tmp/interop/cid ]; then echo 'publisher did not become ready'; tail -50 /tmp/interop/publisher.log; exit 1; fi
          echo "CID=$(cat /tmp/interop/cid)" >> "$GITHUB_ENV"
          echo "PEER=$(cat /tmp/interop/peer)" >> "$GITHUB_ENV"
          echo "NAME=$(cat /tmp/interop/name)" >> "$GITHUB_ENV"
          echo "publisher ready: name=$NAME cid=$CID peer=$PEER"

      - name: Cross-daemon fetch (independent node, bitswap + topic discovery)
        timeout-minutes: 6
        run: GNOSTR_BOOTSTRAP=/ip4/127.0.0.1/tcp/4011/p2p/$PEER node test/interop-fetch.mjs

      - name: git-remote-gnostr interop (real CLI helper clone)
        timeout-minutes: 12
        # the helper is ESM — copying it off its repo breaks module resolution,
        # so shim it: a PATH-visible wrapper execs the real script in /tmp/relay.
        # continue-on-error: the live window below must open for external
        # confirmation even if this step regresses.
        continue-on-error: true
        run: |
          git clone -q https://github.com/RandyMcMillan/helia-ipfs-relay /tmp/relay
          cd /tmp/relay && npm install --no-audit --no-fund
          git config --global protocol.gnostr.allow always
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec node /tmp/relay/git-remote-gnostr.js "$@"\n' > "$HOME/.local/bin/git-remote-gnostr"
          chmod +x "$HOME/.local/bin/git-remote-gnostr"
          export PATH="$HOME/.local/bin:$PATH"
          echo "cloning gnostr://cid/$CID via git-remote-gnostr…"
          GNOSTR_BOOTSTRAP="/ip4/127.0.0.1/tcp/4011/p2p/$PEER" timeout 300 git clone "gnostr://cid/$CID" /tmp/interop-clone
          test -f /tmp/interop-clone/package.json
          test -f /tmp/interop-clone/src/mcp-server.js
          echo 'cloned tree head:'
          git -C /tmp/interop-clone log --oneline | head -5

      - name: Docker peer — build image
        if: matrix.docker
        timeout-minutes: 15
        run: docker build -t ipfs-agentd:interop .

      - name: Docker peer — container fetcher (independent node in-container)
        if: matrix.docker
        timeout-minutes: 8
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v /tmp/interop:/tmp/interop \
            -e GNOSTR_BOOTSTRAP=/ip4/127.0.0.1/tcp/4011/p2p/$PEER \
            -e INTEROP_OUT=/tmp/interop \
            ipfs-agentd:interop node test/interop-fetch.mjs

      - name: Docker peer — container clone via in-repo git-remote-gnostr
        if: matrix.docker
        timeout-minutes: 8
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            ipfs-agentd:interop sh -c '
              mkdir -p /tmp/bin
              printf "#!/bin/sh\nexec node /work/src/git-remote-gnostr.js \"\$@\"\n" > /tmp/bin/git-remote-gnostr
              chmod +x /tmp/bin/git-remote-gnostr
              export PATH=/tmp/bin:$PATH
              git config --global protocol.gnostr.allow always
              rm -rf /tmp/clone
              GNOSTR_BOOTSTRAP="/ip4/127.0.0.1/tcp/4011/p2p/'"$PEER"'" git clone "gnostr://cid/'"$CID"'" /tmp/clone
              git -C /tmp/clone log --oneline -2
              git -C /tmp/clone fsck --strict
            '

      - name: Live window — publisher keeps seeding (external confirmation open)
        timeout-minutes: 25
        run: |
          echo "::notice::LIVE name=$NAME bundle=$CID peer=$PEER — ad on gnostr topic, seeding for ${{ env.INTEROP_LIVE_SECS }}s total"
          echo "tail of publisher log:"
          tail -5 /tmp/interop/publisher.log
          while kill -0 "$(cat /tmp/interop-pub.pid)" 2>/dev/null; do sleep 15; done
          echo "publisher exited — full log:"
          cat /tmp/interop/publisher.log
