name: docker

# Publishes the all-in-one image to GHCR. This workflow owns image pushes:
#   master push  -> ghcr.io/<repo>:latest + :<sha>
#   v* tag       -> ghcr.io/<repo>:<tag> + :latest
#   pull request -> build only (no push) — image build regression gate
# release.yml deliberately does not push images; it owns the GitHub release.

on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

# bash everywhere: on windows runners GitHub maps this to Git Bash,
# which is what the run blocks are written for
defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push unless PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # gha cache is fast but evictable (10GB/repo LRU, 7-day expiry);
          # the registry buildcache survives eviction so a cold gha cache
          # never forces a full npm-ci rebuild
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
